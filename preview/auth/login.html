<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — TalentMap</title>
  <meta name="description" content="Sign in to your TalentMap account to access your resume analysis dashboard." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../static/css/tokens.css" />
  <link rel="stylesheet" href="../../static/css/base.css" />
  <link rel="stylesheet" href="../../static/css/components.css" />
  <link rel="stylesheet" href="../../static/css/auth.css" />
  
</head>
<body class="auth-body">
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="bg-orb bg-orb--1" aria-hidden="true"></div>
  <div class="bg-orb bg-orb--2" aria-hidden="true"></div>
  <div class="bg-orb bg-orb--3" aria-hidden="true"></div>

  
  <div class="auth-card" role="main">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M3 11l18-7-7 18-3-8-8-3z"/></svg></div>
      <span class="brand-name">Talent<em>Map</em></span>
    </div>

    <h1 class="card-title">Welcome back</h1>
    <p class="card-sub-lead">Sign in to continue to your dashboard.</p>

    <form id="loginForm" novalidate>
      <div id="globalError" class="global-error"></div>

      <div class="form-group">
        <label for="email">Email address</label>
        <div class="input-wrap">
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
          <span class="input-icon" aria-hidden="true">✉</span>
        </div>
        <span class="error-msg" id="emailError">Please enter a valid email address.</span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
          <span class="input-icon" aria-hidden="true">🔒</span>
        </div>
        <span class="error-msg" id="passwordError">Password is required.</span>
      </div>

      <div class="form-row">
        <label class="checkbox-label">
          <input type="checkbox" id="remember" name="remember" />
          Remember me
        </label>
        <a href="#" class="link">Forgot password?</a>
      </div>

      <button type="submit" id="loginBtn" class="btn-primary">Sign In</button>
    </form>

    <div class="divider">or</div>

    <div class="card-footer">
      Don't have an account? <a href="register.html" class="link">Create one</a>
    </div>
  </div>


  <script src="../../static/js/background.js"></script>
  
  <script src="../../static/js/auth-login.js"></script>

</body>
</html>
