<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — TalentMap</title>
  <meta name="description" content="Create your TalentMap account and start analyzing resumes against real job descriptions." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../static/css/tokens.css" />
  <link rel="stylesheet" href="../../static/css/base.css" />
  <link rel="stylesheet" href="../../static/css/components.css" />
  <link rel="stylesheet" href="../../static/css/auth.css" />
  
</head>
<body class="auth-body">
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="bg-orb bg-orb--1" aria-hidden="true"></div>
  <div class="bg-orb bg-orb--2" aria-hidden="true"></div>
  <div class="bg-orb bg-orb--3" aria-hidden="true"></div>

  
  <div class="auth-card" role="main">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M3 11l18-7-7 18-3-8-8-3z"/></svg></div>
      <span class="brand-name">Talent<em>Map</em></span>
    </div>

    <h1 class="card-title">Create an account</h1>
    <p class="card-sub-lead">Start mapping your resume against real roles today.</p>

    <form id="registerForm" novalidate>
      <div id="globalError" class="global-error"></div>

      <div class="form-grid">
        <div class="form-group">
          <label for="firstName">First name</label>
          <div class="input-wrap">
            <input type="text" id="firstName" name="first_name" placeholder="Jane" autocomplete="given-name" required />
            <span class="input-icon" aria-hidden="true">👤</span>
          </div>
          <span class="error-msg" id="firstNameError">Required.</span>
        </div>

        <div class="form-group">
          <label for="lastName">Last name</label>
          <div class="input-wrap">
            <input type="text" id="lastName" name="last_name" placeholder="Doe" autocomplete="family-name" required />
            <span class="input-icon" aria-hidden="true">👤</span>
          </div>
          <span class="error-msg" id="lastNameError">Required.</span>
        </div>

        <div class="form-group full">
          <label for="email">Email address</label>
          <div class="input-wrap">
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
            <span class="input-icon" aria-hidden="true">✉</span>
          </div>
          <span class="error-msg" id="emailError">Please enter a valid email address.</span>
        </div>

        <div class="form-group full">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" placeholder="Min. 8 characters" autocomplete="new-password" required />
            <span class="input-icon" aria-hidden="true">🔒</span>
          </div>
          <div class="strength-bar" id="strengthBar">
            <span id="s1"></span><span id="s2"></span><span id="s3"></span><span id="s4"></span>
          </div>
          <div class="strength-label" id="strengthLabel"></div>
          <span class="error-msg" id="passwordError">Password must be at least 8 characters.</span>
        </div>

        <div class="form-group full">
          <label for="confirmPassword">Confirm password</label>
          <div class="input-wrap">
            <input type="password" id="confirmPassword" name="confirm_password" placeholder="Re-enter password" autocomplete="new-password" required />
            <span class="input-icon" aria-hidden="true">🔒</span>
          </div>
          <span class="error-msg" id="confirmError">Passwords do not match.</span>
        </div>
      </div>

      <label class="terms-label">
        <input type="checkbox" id="terms" name="terms" required />
        I agree to the <a href="#" class="link">Terms of Service</a> and <a href="#" class="link">Privacy Policy</a>
      </label>
      <span class="error-msg" id="termsError" style="display:none;margin-top:-.8rem;margin-bottom:.8rem;">You must accept the terms.</span>

      <button type="submit" id="registerBtn" class="btn-primary">Create Account</button>
    </form>

    <div class="divider">or</div>

    <div class="card-footer">
      Already have an account? <a href="login.html" class="link">Sign in</a>
    </div>
  </div>


  <script src="../../static/js/background.js"></script>
  
  <script src="../../static/js/auth-register.js"></script>

</body>
</html>
