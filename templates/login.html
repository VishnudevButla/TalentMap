<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — TalentMap</title>
  <meta name="description" content="Sign in to your TalentMap account to access your talent management dashboard." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
     
    :root {
      --clr-bg-1:    #0d0f1a;
      --clr-bg-2:    #111827;
      --clr-accent:  #6366f1;
      --clr-accent2: #8b5cf6;
      --clr-text:    #f1f5f9;
      --clr-muted:   #94a3b8;
      --clr-border:  rgba(255,255,255,0.08);
      --clr-glass:   rgba(255,255,255,0.04);
      --clr-error:   #f87171;
      --radius:      14px;
      --transition:  0.22s cubic-bezier(0.4,0,0.2,1);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--clr-bg-1);
      color: var(--clr-text);
    }

    /* ── Animated background ── */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.35;
      animation: float 8s ease-in-out infinite;
      pointer-events: none;
    }
    .bg-orb--1 { width: 480px; height: 480px; background: #6366f1; top: -120px; left: -140px; animation-delay: 0s; }
    .bg-orb--2 { width: 360px; height: 360px; background: #8b5cf6; bottom: -80px; right: -100px; animation-delay: 3s; }
    .bg-orb--3 { width: 260px; height: 260px; background: #06b6d4; top: 50%; left: 50%; transform: translate(-50%,-50%); animation-delay: 5s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50%       { transform: translateY(-24px) scale(1.04); }
    }
    .bg-orb--3 {
      animation-name: float3;
    }
    @keyframes float3 {
      0%, 100% { transform: translate(-50%,-50%) scale(1); }
      50%       { transform: translate(-50%, calc(-50% - 20px)) scale(1.05); }
    }

    /* ── Card ── */
    .card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      margin: 1.5rem;
      background: rgba(17, 24, 39, 0.72);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--clr-border);
      border-radius: 22px;
      padding: 2.6rem 2.4rem 2.2rem;
      box-shadow: 0 32px 80px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.04);
      animation: slideUp 0.5s cubic-bezier(0.4,0,0.2,1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Logo / Brand ── */
    .brand {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      margin-bottom: 2rem;
    }
    .brand-icon {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--clr-accent), var(--clr-accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      box-shadow: 0 4px 14px rgba(99,102,241,0.5);
    }
    .brand-name { font-size: 1.18rem; font-weight: 700; letter-spacing: -0.02em; }
    .brand-name span { color: var(--clr-accent); }

    /* ── Heading ── */
    .card-title { font-size: 1.55rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1.2; }
    .card-sub   { font-size: 0.88rem; color: var(--clr-muted); margin-top: 0.4rem; margin-bottom: 1.8rem; }

    /* ── Form ── */
    .form-group { margin-bottom: 1.15rem; }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--clr-muted);
      margin-bottom: 0.45rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .input-wrap { position: relative; }
    .input-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--clr-muted); font-size: 1rem; pointer-events: none;
      transition: color var(--transition);
    }
    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 0.78rem 1rem 0.78rem 2.6rem;
      background: var(--clr-glass);
      border: 1px solid var(--clr-border);
      border-radius: var(--radius);
      color: var(--clr-text);
      font-size: 0.93rem;
      font-family: inherit;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    input::placeholder { color: #475569; }
    input:focus {
      border-color: var(--clr-accent);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.18);
    }
    input:focus + .input-icon,
    .input-wrap:focus-within .input-icon { color: var(--clr-accent); }

    /* ── Row (remember + forgot) ── */
    .form-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.4rem; font-size: 0.83rem;
    }
    .checkbox-label {
      display: flex; align-items: center; gap: 0.45rem;
      color: var(--clr-muted); cursor: pointer; user-select: none;
    }
    .checkbox-label input[type="checkbox"] {
      width: 15px; height: 15px; padding: 0;
      accent-color: var(--clr-accent);
      border-radius: 4px;
      cursor: pointer;
    }
    .link { color: var(--clr-accent); text-decoration: none; font-weight: 500; transition: opacity var(--transition); }
    .link:hover { opacity: 0.75; }

    /* ── Button ── */
    .btn-primary {
      width: 100%;
      padding: 0.82rem;
      background: linear-gradient(135deg, var(--clr-accent), var(--clr-accent2));
      border: none;
      border-radius: var(--radius);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.01em;
      box-shadow: 0 6px 20px rgba(99,102,241,0.38);
      transition: opacity var(--transition), transform var(--transition), box-shadow var(--transition);
      position: relative;
      overflow: hidden;
    }
    .btn-primary::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.08), transparent);
      opacity: 0;
      transition: opacity var(--transition);
    }
    .btn-primary:hover { opacity: 0.92; transform: translateY(-1px); box-shadow: 0 10px 28px rgba(99,102,241,0.45); }
    .btn-primary:hover::after { opacity: 1; }
    .btn-primary:active { transform: translateY(0); }

    /* ── Divider ── */
    .divider {
      display: flex; align-items: center; gap: 0.8rem;
      color: var(--clr-muted); font-size: 0.78rem;
      margin: 1.4rem 0;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1;
      height: 1px; background: var(--clr-border);
    }

    /* ── Footer ── */
    .card-footer { text-align: center; font-size: 0.85rem; color: var(--clr-muted); margin-top: 1.2rem; }

    /* ── Error message ── */
    .error-msg {
      display: none;
      font-size: 0.78rem;
      color: var(--clr-error);
      margin-top: 0.35rem;
      padding-left: 0.2rem;
    }
    input.is-error { border-color: var(--clr-error); }
    input.is-error:focus { box-shadow: 0 0 0 3px rgba(248,113,113,0.18); }
  </style>
</head>
<body>

  <!-- Background orbs -->
  <div class="bg-orb bg-orb--1"></div>
  <div class="bg-orb bg-orb--2"></div>
  <div class="bg-orb bg-orb--3"></div>

  <div class="card" role="main">

    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon">🗺️</div>
      <span class="brand-name">Talent<span>Map</span></span>
    </div>

    <h1 class="card-title">Welcome back</h1>
    <p class="card-sub">Sign in to continue to your dashboard.</p>

    <form id="loginForm" novalidate>
      {% csrf_token %}

      <div class="form-group">
        <label for="email">Email address</label>
        <div class="input-wrap">
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
          <span class="input-icon" aria-hidden="true">✉</span>
        </div>
        <span class="error-msg" id="emailError">Please enter a valid email address.</span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
          <span class="input-icon" aria-hidden="true">🔒</span>
        </div>
        <span class="error-msg" id="passwordError">Password is required.</span>
      </div>

      <div class="form-row">
        <label class="checkbox-label">
          <input type="checkbox" id="remember" name="remember" />
          Remember me
        </label>
        <a href="#" class="link">Forgot password?</a>
      </div>

      <button type="submit" id="loginBtn" class="btn-primary">Sign In</button>
    </form>

    <div class="divider">or</div>

    <div class="card-footer">
      Don't have an account? <a href="register.html" class="link">Create one</a>
    </div>

  </div>

  <script>
    const form      = document.getElementById('loginForm');
    const emailEl   = document.getElementById('email');
    const passEl    = document.getElementById('password');
    const emailErr  = document.getElementById('emailError');
    const passErr   = document.getElementById('passwordError');

    function showError(input, errEl) {
      input.classList.add('is-error');
      errEl.style.display = 'block';
    }
    function clearError(input, errEl) {
      input.classList.remove('is-error');
      errEl.style.display = 'none';
    }

    emailEl.addEventListener('input', () => clearError(emailEl, emailErr));
    passEl.addEventListener('input',  () => clearError(passEl,  passErr));

    form.addEventListener('submit', (e) => {
      let valid = true;

      if (!emailEl.value || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailEl.value)) {
        showError(emailEl, emailErr); valid = false;
      } else { clearError(emailEl, emailErr); }

      if (!passEl.value) {
        showError(passEl, passErr); valid = false;
      } else { clearError(passEl, passErr); }

      if (!valid) e.preventDefault();
    });
  </script>
</body>
</html>
