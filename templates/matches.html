{% extends "layouts/base_app.html" %}

{% block title %}Your Matches — TalentMap{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{{ url_for('static', path='css/dashboard.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/history.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/matches.css') }}" />
{% endblock %}

{% block content %}
  <div class="topbar">
    <div>
      <h1>Your Matches</h1>
      <p class="card-sub" id="matchesCount">Loading…</p>
    </div>
  </div>

  <div class="card">
    <div class="filter-pills" id="jobFilterPills">
      <span class="pill is-active" data-filter="all">All</span>
      <span class="pill" data-filter="excellent">Excellent</span>
      <span class="pill" data-filter="good">Good</span>
      <span class="pill" data-filter="remote">Remote</span>
    </div>
    <div class="history-list" id="matchesList">
      <p class="card-sub">Loading your matches…</p>
    </div>
  </div>
{% endblock %}

{% block extra_js %}
  <script src="{{ url_for('static', path='js/matches.js') }}"></script>
{% endblock %}
