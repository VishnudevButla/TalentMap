<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}TalentMap{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/tokens.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/base.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/components.css') }}" />
  {% block extra_css %}{% endblock %}
  <script>
    // Apply the persisted theme choice before paint (avoids a flash of the
    // wrong theme). Set by static/js/settings.js on the Settings page.
    (function () {
      var t = localStorage.getItem('theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <script src="{{ url_for('static', path='js/auth-guard.js') }}"></script>
</head>
<body>
  <div class="page-glow" aria-hidden="true"></div>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <div class="shell">
    {% include "partials/nav_rail.html" %}

    <main class="main">
      <button class="rail-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="{{ url_for('static', path='js/background.js') }}"></script>
  <script src="{{ url_for('static', path='js/nav.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
