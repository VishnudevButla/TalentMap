<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}TalentMap{% endblock %}</title>
  <meta name="description" content="{% block description %}Sign in to TalentMap to analyze your resume against real job descriptions.{% endblock %}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/tokens.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/base.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/components.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/auth.css') }}" />
  {% block extra_css %}{% endblock %}
</head>
<body class="auth-body">
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="bg-orb bg-orb--1" aria-hidden="true"></div>
  <div class="bg-orb bg-orb--2" aria-hidden="true"></div>
  <div class="bg-orb bg-orb--3" aria-hidden="true"></div>

  {% block content %}{% endblock %}

  <script src="{{ url_for('static', path='js/background.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
